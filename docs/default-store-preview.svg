<svg viewBox="0 0 500 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Stores screen</title>
  <desc id="desc">The Stores tab listing global and personal stores, with a star badge marking the current default store.</desc>

  <rect x="0" y="0" width="500" height="380" fill="#f2f2f7" rx="0"/>

  <text x="20" y="34" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="700" fill="#111827">Stores</text>

  <text x="20" y="62" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#6b7280">DEFAULT STORES (GLOBAL)</text>

  <rect x="20" y="74" width="460" height="46" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="36" y="102" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#111827">Aldi</text>
  <rect x="370" y="86" width="96" height="22" rx="11" fill="#FFD700"/>
  <text x="418" y="101" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#7a5c00" text-anchor="middle" font-weight="600">⭐ Default</text>

  <rect x="20" y="126" width="460" height="46" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="36" y="154" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#111827">Walmart</text>
  <rect x="386" y="138" width="80" height="22" rx="6" fill="#e5e7eb"/>
  <text x="426" y="153" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">Set Default</text>

  <rect x="20" y="178" width="460" height="46" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="36" y="206" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#111827">Amazon</text>
  <rect x="386" y="190" width="80" height="22" rx="6" fill="#e5e7eb"/>
  <text x="426" y="205" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">Set Default</text>

  <text x="20" y="252" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#6b7280">MY STORES</text>

  <rect x="20" y="264" width="460" height="46" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="36" y="292" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#111827">Woodman's</text>
  <rect x="386" y="276" width="80" height="22" rx="6" fill="#e5e7eb"/>
  <text x="426" y="291" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">Set Default</text>

  <rect x="20" y="324" width="350" height="34" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="34" y="346" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#9ca3af">Add a store...</text>
  <rect x="380" y="324" width="100" height="34" rx="8" fill="#2563eb"/>
  <text x="430" y="346" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Add</text>
</svg>
