<svg viewBox="0 0 700 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Add Recipe screen</title>
  <desc id="desc">The app's recipe builder showing the ingredients step, with quantity, unit, store, and substitute group fields, plus a default ingredient marked with a star.</desc>

  <rect x="0" y="0" width="700" height="600" fill="#eef0f4" rx="0"/>

  <rect x="60" y="30" width="580" height="540" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <text x="92" y="78" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="700" fill="#111827">Add Recipe</text>
  <circle cx="610" cy="70" r="14" fill="#f3f4f6"/>
  <text x="610" y="76" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">×</text>

  <circle cx="300" cy="108" r="5" fill="#d1d5db"/>
  <circle cx="325" cy="108" r="5" fill="#2563eb"/>
  <circle cx="350" cy="108" r="5" fill="#d1d5db"/>
  <circle cx="375" cy="108" r="5" fill="#d1d5db"/>

  <text x="92" y="148" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="600" fill="#111827">Ingredients</text>
  <text x="92" y="170" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#6b7280">Add all ingredients with store + unit + substitutes.</text>

  <g>
    <rect x="92" y="188" width="516" height="118" rx="12" fill="#f8f8fa" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="108" y="200" width="484" height="32" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="118" y="221" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#111827">Chicken thighs</text>

    <rect x="108" y="240" width="80" height="30" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="148" y="260" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#111827" text-anchor="middle">2</text>
    <rect x="196" y="240" width="80" height="30" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="236" y="260" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#111827" text-anchor="middle">LB</text>
    <rect x="284" y="240" width="140" height="30" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="296" y="260" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#111827">Aldi</text>
    <text x="408" y="260" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#9ca3af" text-anchor="end">▾</text>

    <rect x="108" y="278" width="370" height="28" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="118" y="297" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#111827">Protein</text>
    <rect x="488" y="278" width="104" height="28" rx="6" fill="#FFD700"/>
    <text x="540" y="296" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#7a5c00" text-anchor="middle">⭐ Default</text>
  </g>

  <g>
    <rect x="92" y="316" width="516" height="118" rx="12" fill="#f8f8fa" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="108" y="328" width="484" height="32" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="118" y="349" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#111827">Chicken breast</text>

    <rect x="108" y="368" width="80" height="30" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="148" y="388" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#111827" text-anchor="middle">1.5</text>
    <rect x="196" y="368" width="80" height="30" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="236" y="388" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#111827" text-anchor="middle">LB</text>
    <rect x="284" y="368" width="140" height="30" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="296" y="388" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#111827">Walmart</text>
    <text x="408" y="388" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#9ca3af" text-anchor="end">▾</text>

    <rect x="108" y="406" width="370" height="28" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="118" y="425" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#111827">Protein</text>
    <rect x="488" y="406" width="104" height="28" rx="6" fill="#e5e7eb"/>
    <text x="540" y="424" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#4b5563" text-anchor="middle">Set Default</text>
  </g>

  <rect x="92" y="450" width="220" height="42" rx="10" fill="#2563eb"/>
  <text x="202" y="476" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">+ Add Ingredient</text>

  <line x1="92" y1="516" x2="608" y2="516" stroke="#e5e7eb" stroke-width="1"/>

  <rect x="420" y="530" width="90" height="36" rx="9" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="465" y="553" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#374151" text-anchor="middle">← Back</text>

  <rect x="520" y="530" width="88" height="36" rx="9" fill="#2563eb"/>
  <text x="564" y="553" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Next →</text>
</svg>
