<svg viewBox="0 0 500 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Grocery list screen</title>
  <desc id="desc">The grocery list screen grouped first by store, then by aisle within each store, with checkboxes next to each item.</desc>

  <rect x="0" y="0" width="500" height="380" fill="#f2f2f7" rx="0"/>

  <rect x="20" y="20" width="460" height="160" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="38" y="48" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="700" fill="#111827">🛒 Aldi</text>

  <text x="38" y="74" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#6b7280">PRODUCE</text>
  <rect x="38" y="82" width="14" height="14" rx="3" fill="#ffffff" stroke="#d1d5db"/>
  <text x="60" y="93" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#111827">2 onions</text>
  <rect x="38" y="104" width="14" height="14" rx="3" fill="#2563eb"/>
  <text x="46" y="115" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="60" y="115" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#9ca3af" text-decoration="line-through">3 bell peppers</text>

  <text x="270" y="74" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#6b7280">BAKING</text>
  <rect x="270" y="82" width="14" height="14" rx="3" fill="#ffffff" stroke="#d1d5db"/>
  <text x="292" y="93" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#111827">1 lb sugar</text>

  <line x1="38" y1="140" x2="462" y2="140" stroke="#f3f4f6" stroke-width="1"/>
  <text x="38" y="160" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#6b7280">MEAT</text>
  <rect x="38" y="166" width="14" height="14" rx="3" fill="#ffffff" stroke="#d1d5db"/>
  <text x="60" y="177" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#111827">2 lb chicken thighs</text>

  <rect x="20" y="196" width="460" height="160" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="38" y="224" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="700" fill="#111827">🛒 Walmart</text>

  <text x="38" y="250" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#6b7280">DAIRY</text>
  <rect x="38" y="258" width="14" height="14" rx="3" fill="#ffffff" stroke="#d1d5db"/>
  <text x="60" y="269" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#111827">1 gal milk</text>
  <rect x="38" y="280" width="14" height="14" rx="3" fill="#ffffff" stroke="#d1d5db"/>
  <text x="60" y="291" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#111827">8 oz shredded cheese</text>

  <text x="270" y="250" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#6b7280">HOUSEHOLD</text>
  <rect x="270" y="258" width="14" height="14" rx="3" fill="#ffffff" stroke="#d1d5db"/>
  <text x="292" y="269" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#111827">Paper towels</text>

  <line x1="38" y1="306" x2="462" y2="306" stroke="#f3f4f6" stroke-width="1"/>
  <text x="38" y="326" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#6b7280">SNACKS</text>
  <rect x="38" y="332" width="14" height="14" rx="3" fill="#ffffff" stroke="#d1d5db"/>
  <text x="60" y="343" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#111827">Tortilla chips</text>
</svg>
